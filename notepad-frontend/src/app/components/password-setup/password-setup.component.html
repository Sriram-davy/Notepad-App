<div class="setup-container">
  <div class="setup-card glass">
    <div class="header">
      <button class="back-btn" [routerLink]="['/', username]">←</button>
      <h1>{{ isProtected ? 'Update Password' : 'Secure your Notepad' }}</h1>
    </div>
    
    <div *ngIf="!isChecking">
      <p class="description">
        {{ isProtected ? 'Update or remove the password for ' + username + '\'s notepad.' : 'Add a password to ' + username + '\'s notepad to keep your notes private.' }}
      </p>

      <div class="form-group" *ngIf="isProtected">
        <label>Current Password</label>
        <input 
          type="password" 
          [(ngModel)]="currentPassword" 
          placeholder="Required to make changes"
        />
      </div>

      <div class="form-group">
        <label>New Password</label>
        <input 
          type="password" 
          [(ngModel)]="newPassword" 
          placeholder="Min 4 characters"
        />
      </div>

      <div class="form-group">
        <label>Password Hint (Optional)</label>
        <input 
          type="text" 
          [(ngModel)]="passwordHint" 
          placeholder="Something to help you remember"
        />
      </div>

      <div class="actions">
        <button class="remove-btn" *ngIf="isProtected" (click)="removePassword()" [disabled]="isLoading">Remove Password</button>
        <button class="save-btn" (click)="savePassword()" [disabled]="isLoading || !newPassword">
          {{ isLoading ? 'Saving...' : (isProtected ? 'Update Password' : 'Set Password') }}
        </button>
      </div>

      <p class="error" *ngIf="error">{{ error }}</p>
      <p class="success" *ngIf="success">{{ success }}</p>
    </div>
    
    <div *ngIf="isChecking" class="loading-state">
      <p class="description">Loading settings...</p>
    </div>
  </div>
</div>
