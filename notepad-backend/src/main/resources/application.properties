server.port=${PORT:8080}


spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?user=postgres.cchnzkxpkgjpkkesqvmw&password=Sri560093Ben
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Sri560093Ben}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# ? REQUIRED for Supabase pooler (this is the key fix)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Optional safety
spring.jpa.properties.hibernate.default_schema=public

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Logging
logging.level.com.notesnap=TRACE
logging.level.org.springframework.web=TRACE

# JWT Configuration - stable key so tokens survive backend restarts
# To rotate: replace with a new `openssl rand -base64 32` or PowerShell equivalent
jwt.secret=${JWT_SECRET}

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
